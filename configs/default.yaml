# NeuroNPU hardware configuration (flat key: value; '#' starts a comment).
# This file is the tunable side of the simulator — adjust freely.

# --- Core ---
core_clock_ghz: 1.0      # global sim time unit is core-clock cycles
num_cores: 1             # independent cores/tiles; >1 share DDR + SRAM bandwidth

# --- Tensor Engine (systolic MAC array) ---
mac_rows: 32
mac_cols: 32

# --- Vector Engine ---
vector_lanes: 256        # fp32-equivalent lanes per cycle

# --- DDR (external memory) ---
ddr_freq_mhz: 3200       # data-rate base clock; DDR moves 2 words/clock
ddr_width_bits: 64       # bus width per channel
ddr_channels: 2
ddr_latency_ns: 100      # fixed latency added per DMA burst
ddr_size_mb: 4096
dma_channels: 1          # concurrent DMA transfers; >1 share DDR bandwidth fairly

# --- SRAM scratchpad (on-chip, software-managed) ---
sram_size_kb: 4096
sram_banks: 16
sram_bank_width_bytes: 16   # bytes/cycle per bank; aggregate SRAM BW = banks x this

# --- Features ---
double_buffer: true      # overlap is expressed by the compiler via sync events

# --- Energy model (illustrative; tune to your silicon) ---
energy_per_mac_pj: 0.04        # pJ per MAC
energy_per_ddr_byte_pj: 20.0   # pJ per DDR byte moved
energy_per_sram_byte_pj: 1.0   # pJ per SRAM byte touched
static_power_mw: 50.0          # leakage / always-on power
